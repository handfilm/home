    <style>
      html, body {
        background-color: #0e0d0b !important;
        color: #f3efe6 !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        width: 100%;
        background-color: #0e0d0b;
      }
      .boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0e0d0b;
        color: #f3efe6;
        font-family: 'Courier New', Courier, monospace;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        z-index: 9999;
      }
      .boot-spinner {
        width: 36px;
        height: 36px;
        border: 2px solid rgba(243, 239, 230, 0.15);
        border-top-color: #c8b89a;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="text/javascript">
      // GitHub Pages SPA Route Restoration
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script>
      // Diagnostic handler: catch unhandled bootstrap errors & slow mount
      window.__appMounted = false;
      window.addEventListener('error', function(e) {
        var el = document.getElementById('boot-error-diag');
        if (el && e) {
          el.style.display = 'block';
          el.innerHTML = '<div style="background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); padding: 8px 12px; border-radius: 4px; margin-top: 10px;">' +
            '<strong>App Loader Notice:</strong> ' + (e.message || 'Script execution pending') +
            '</div>';
        }
      });
      setTimeout(function() {
        if (!window.__appMounted) {
          var el = document.getElementById('boot-error-diag');
          if (el) {
            el.style.display = 'block';
            el.innerHTML = '<div style="background: rgba(200,184,154,0.1); border: 1px solid rgba(200,184,154,0.25); padding: 10px 14px; border-radius: 4px; font-family: monospace; font-size: 10px; color: #c8b89a; margin-top: 12px; text-align: center; max-width: 320px; line-height: 1.6;">' +
              'If this takes more than a few seconds, verify that GitHub Pages is set to deploy from <strong>gh-pages</strong> branch or <strong>GitHub Actions</strong>.' +
              '<div style="margin-top: 8px;"><a href="javascript:location.reload()" style="color: #f3efe6; text-decoration: underline; font-weight: bold; cursor: pointer;">Tap to Reload</a></div>' +
              '</div>';
          }
        }
      }, 3500);
    </script>

      </noscript>
